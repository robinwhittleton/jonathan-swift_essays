			<h2 epub:type="title">A Proposal for Correcting, Improving, and Ascertaining the English Tongue<a href="endnotes.xhtml#note-27" id="noteref-27" epub:type="noteref">27</a></h2>
			<div epub:type="z3998:letter">
				<header role="presentation">
					<p epub:type="se:letter.dateline">London, <time datetime="1711-03-05"><abbr>Feb.</abbr> 22, 1711⁠–⁠12</time>.</p>
					<p epub:type="z3998:salutation">My Lord,</p>
				</header>
				<p>What I had the honour of mentioning to your lordship some time ago in conversation, was not a new thought, just then started by accident or occasion, but the result of long reflection; and I have been confirmed in my sentiments, by the opinion of some very judicious persons, with whom I consulted. They all agreed, that nothing would be of greater use toward the improvement of knowledge and politeness, than some effectual method for correcting, enlarging, and ascertaining our language; and they think it a work<a href="endnotes.xhtml#note-28" id="noteref-28" epub:type="noteref">28</a> very possible to be compassed under the protection of a prince, the countenance and encouragement of a ministry, and the care of proper persons chosen for such an undertaking<a href="endnotes.xhtml#note-29" id="noteref-29" epub:type="noteref">29</a>. I was glad to find your lordship’s answer in so different a style, from what has been commonly made use of on the like occasions, for some years past, That all such thoughts must be deferred to a time of peace: a topic, which some have carried so far, that they would not have us by any means think of preserving our civil or religious constitution, because we are engaged in a war abroad. It will be among the distinguishing marks of your ministry, my lord, that you have a genius above all such regards, and that no reasonable proposal for the honour, the advantage, or the ornament of your country, however foreign to your more immediate office, was ever neglected by you. I confess the merit of this candour and condescension is very much lessened, because your lordship hardly leaves us room to offer our good wishes; removing all our difficulties, and supplying our wants, faster than the most visionary projector can adjust his schemes. And therefore, my lord, the design of this paper is not so much to offer you ways and means, as to complain of a grievance, the redressing of which is to be your own work, as much as that of paying the nation’s debts, or opening a trade into the South-Sea; and though not of such immediate benefit, as either of these, of any other of your glorious actions, yet, perhaps, in future ages not less to your honour.</p>
				<p>My lord, I do here, in the name of all the learned and polite persons of the nation, complain to your lordship, as first minister, that our language is extremely imperfect; that its daily improvements are by no means in proportion to its daily corruptions; that the pretenders to polish and refine it, have chiefly multiplied abuses and absurdities; and that in many instances it offends against every part of grammar. But lest your lordship should think my censure too severe, I shall take leave to be more particular.</p>
				<p>I believe your lordship will agree with me in the reason, why our language is less refined than those of Italy, Spain, or France. ’Tis plain, that the Latin tongue in its purity was never in this island, toward the conquest of which, few or no attempts were made till the time of Claudius; neither was that language ever so vulgar in Britain, as it is known to have been in Gaul and Spain. Farther, we find that the Roman legions here were at length all recalled to help their country against the Goths, and other barbarous invaders. Meantime the Britains, left to shift for themselves, and daily harassed by cruel inroads from the Picts, were forced to call in the Saxons for their defence; who, consequently, reduced the greatest part of the island to their own power, drove the Britains into the most remote and mountainous parts, and the rest of the country, in customs, religion, and language, became wholly Saxon. This I take to be the reason, why there are more Latin words remaining in the British tongue, than in the old Saxon, which, excepting some few variations in the orthography, is the same in most original words with our present English, as well as with the German and other Northern dialects.</p>
				<p>Edward the Confessor, having lived long in France, appears to be the first who introduced any mixture of the French tongue with the Saxon; the court affecting what the prince was fond of, and others taking it up for a fashion, as it is now with us. William the Conqueror proceeded much farther; bringing over with him vast numbers of that nation, scattering them in every monastery, giving them great quantities of land, directing all pleadings to be in that language, and endeavouring to make it universal in the kingdom. This at least is the opinion generally received: but your lordship has fully convinced me, that the French tongue made yet a greater progress here under Harry the Second, who had large territories on that continent both from his father and his wife, made frequent journeys and expeditions thither, and was always attended with a number of his countrymen, retainers at his court. For some centuries after, there was a constant intercourse between France and England, by the dominions we possessed there, and the conquests we made; so that our language, between two and three hundred years ago, seems to have had a greater mixture with French, than at present; many words having been afterward rejected, and some since the time of Spencer; although we have still retained not a few, which have been long antiquated in France. I could produce several instances of both kinds, if it were of any use or entertainment.</p>
				<p>To examine into the several circumstances by which the language of a country may be altered, would force me to enter into a wide field. I shall only observe, that the Latin, the French, and the English, seem to have undergone the same fortune. The first from the days of Romulus to those of Julius Caesar, suffered perpetual changes: and by what we meet in those authors who occasionally speak on that subject, as well as from certain fragments of old laws, it is manifest that the Latin three hundred years before Tully was as unintelligible in his time, as the English and French of the same period are now; and these two have changed as much since William the Conqueror, (which is but little less than seven hundred years) as the Latin appears to have done in the like term. Whether our language, or the French, will decline as fast as the Roman did, is a question, that would perhaps admit more debate than it is worth. There were many reasons for the corruptions of the last: as, the change of their government to a tyranny, which ruined the study of eloquence, there being no farther use or encouragement for popular orators: their giving not only the freedom of the city, but capacity for employments, to several towns in Gaul, Spain, and Germany, and other distant parts, as far as Asia; which brought a great number of foreign pretenders into Rome: the slavish disposition of the senate and people, by which the wit and eloquence of the age were wholly turned into panegyric, the most barren of all subjects: the great corruption of manners, and introduction of foreign luxury, with foreign terms to express it, with several others, that might be assigned; not to mention those invasions from the Goths and Vandals, which are too obvious to insist on<a href="endnotes.xhtml#note-30" id="noteref-30" epub:type="noteref">30</a>.</p>
				<p>The Roman language arrived at great perfection, before it began to decay: and the French, for these last fifty years, has been polishing as much as it will bear, and appears to be declining by the natural inconstancy of that people, and the affectation of some late authors to introduce and multiply cant words, which is the most ruinous corruption, in any language. La Bruyere, a late celebrated writer among them, makes use of many new terms, which are not to be found in any of the common dictionaries before his time. But the English tongue is not arrived to such a degree of perfection, as to make us apprehend any thoughts of its decay; and if it were once refined to a certain standard, perhaps there might be ways found out to fix it forever, or at least till we are invaded and made a conquest<a href="endnotes.xhtml#note-31" id="noteref-31" epub:type="noteref">31</a> by some other state; and even then our best writings might probably be preserved with care, and grow into esteem, and the authors have a chance for immortality.</p>
				<p>But without such great revolutions as these (to which we are, I think, less subject than kingdoms upon the continent) I see no absolute necessity why any language should be perpetually changing; for we find many examples to the contrary. From Homer to Plutarch are above a thousand years; so long at least the purity of the Greek tongue may be allowed to last, and we know not how far before. The Grecians spread their colonies round all the coasts of Asia Minor, even to the northern parts lying toward the Euxine, in every island of the Ægæan sea, and several others in the Mediterranean; where the language was preserved entire for many ages, after they themselves became colonies to Rome, and till they were overrun by the barbarous nations upon the fall of that empire. The Chinese have books in their language above two thousand years old, neither have the frequent conquests of the Tartars been able to alter it. The German, Spanish, and Italian, have admitted few or no changes for some ages past. The other languages of Europe I know nothing of; neither is there any occasion to consider them.</p>
				<p>Having taken this compass, I return to those considerations upon our own language, which I would humbly ofter your lordship. The period, wherein the English tongue received most improvement, I take to commence with the beginning of queen Elizabeth’s reign, and to conclude with the great rebellion in forty two. ’Tis true, there was a very ill taste both of style and wit, which prevailed under king James the first; but that seems to have been corrected in the first years of his successor, who, among many other qualifications of an excellent prince, was a great patron of learning. From the civil war to this present time, I am apt to doubt, whether the corruptions in our language have not at least equalled the refinements of it; and these corruptions very few of the best authors in our age have wholly escaped. During the usurpation, such an infusion of enthusiastic jargon prevailed in every writing, as was not shaken off in many years after. To this succeeded that licentiousness which entered with the restoration, and from infecting our religion and morals, fell to corrupt our language; which last was not likely to be much improved by those, who at the time made up the court of king Charles the second; either such who had followed him in his banishment, or who had been altogether conversant in the dialect of those fanatic times; or young men, who had been educated in the same country: so that the court, which used to be the standard of propriety and correctness of speech, was then, and, I think, has ever since continued, the worst school in England for that accomplishment; and so will remain, till better care be taken in the education of our young nobility, that they may set out into the world with some foundation of literature, in order to qualify them for patterns of politeness. The consequence of this defect, upon our language, may appear from the plays, and other compositions written for entertainment within fifty years past; filled with a succession of affected phrases, and new conceited words, either borrowed from the current style of the court, or from those, who, under the character of men of wit and pleasure, pretended to give the law. Many of these refinements have already been long antiquated, and are now hardly intelligible; which is no wonder, when they were the product only of ignorance and caprice.</p>
				<p>I have never known this great town without one or more dunces of figure, who had credit enough to give rise to some new word, and propagate it in most conversations, though it had neither humour nor significancy. If it struck the present taste, it was soon transferred into the plays and current scribbles of the week, and became an addition to our language; while the men of wit and learning, instead of early obviating such corruptions, were too often seduced to imitate and comply with them.</p>
				<p>There is another set of men, who have contributed very much to the spoiling of the English tongue; I mean the poets from the time of the restoration. These gentlemen, although they could not be insensible how much our language was already overstocked with monosyllables, yet, to save time and pains, introduced that barbarous custom of abbreviating words, to fit them to the measure of their verses; and this they have frequently done so very injudiciously, as to form such harsh unharmonious sounds, that none but a northern ear could endure; they have joined the most obdurate consonants without one intervening vowel, only to shorten a syllable: and their taste in time became so depraved, that what was at first a poetical license, not to be justified, they made their choice, alleging, that the words pronounced at length sounded faint and languid. This was a pretence to take up the same custom in prose: so that most of the books we see nowadays, are full of those manglings and abbreviations. Instances of this abuse are innumerable: what does your lordship think of the words, drudg’d, disturb’d, rebuk’d, fledg’d, and a thousand others everywhere to be met with in prose as well as verse? Where by leaving out a vowel to save a syllable, we form so jarring a sound, and so difficult to utter, that I have often wondered how it could ever obtain.</p>
				<p>Another cause (and perhaps borrowed from the former) which has contributed not a little to the maiming of our language, is a foolish opinion, advanced of late years, that we ought to spell exactly as we speak; which, beside the obvious inconvenience of utterly destroying our etymology, would be a thing we should never see an end of. Not only the several towns and counties of England have a different way of pronouncing, but even here in London they clip their words after one manner about the court, another in the city, and a third in the suburbs: and in a few years, it is probable, will all differ from themselves, as fancy or fashion shall direct: all which reduced to writing would entirely confound orthography. Yet many people are so fond of this conceit, that it is sometimes a difficult matter to read modern books and pamphlets; where the words are so curtailed, and varied from their original spelling, that whoever has been used to plain English, will hardly know them by sight.</p>
				<p>Several young men at the universities, terribly possessed with the fear of pedantry, run into a worse extreme, and think all politeness to consist in reading the daily trash sent down to them from hence: this they call knowing the world, and reading men and manners. Thus furnished they come up to town, reckon all their errors for accomplishments, borrow the newest set of phrases; and if they take a pen into their hands, all the odd words they have picked up in a coffeehouse, or a gaming ordinary, are produced as flowers of style; and the orthography refined to the utmost. To this we owe those monstrous productions, which under the name of Trips, Spies, Amusements, and other conceited appellations, have overrun us for some years past. To this we owe that strange race of wits, who tell us, they write to the humour of the age. And I wish I could say, these quaint fopperies were wholly absent from graver subjects. In short, I would undertake to show your lordship several pieces, where the beauties of this kind are so predominant, that with all your skill in languages, you could never be able to read or understand them.</p>
				<p>But I am very much mistaken, if many of these false refinements among us do not arise from a principle, which would quite destroy their credit, if it were well understood and considered. For I am afraid, my lord, that with all the real good qualities of our country, we are naturally not very polite. This perpetual disposition to shorten our words by retrenching the vowels, is nothing else but a tendency to lapse into the barbarity of those northern nations, from whom we are descended, and whose languages labour all under the same defect. For it is worthy our observation, that the Spaniards, the French, and the Italians, although derived from the same northern ancestors with ourselves, are with the utmost difficulty taught to pronounce our words, which the Swedes and Danes, as well as the Germans and the Dutch, attain to with ease, because our syllables resemble theirs in the roughness and frequency of consonants. Now, as we struggle with an ill climate to improve the nobler kinds of fruits, are at the expense of walls to receive and reverberate the faint rays of the sun, and fence against the northern blasts, we sometimes, by the help of a good soil, equal the production of warmer countries, who have no need to be at so much cost and care. It is the same thing: with respect to the politer arts among us; and the same defect of heat which gives a fierceness to our natures, may contribute to that roughness of our language, which bears some analogy to the harsh fruit of colder countries. For I do not reckon that we want a genius more than the rest of our neighbours: but your lordship will be of my opinion, that we ought to struggle with these natural disadvantages as much as we can, and be careful whom we employ, whenever we design to correct them, which is a work that has hitherto been assumed by the least qualified hands. So that if the choice had been left to me, I would rather have trusted the refinement of our language, as far as it relates to sound, to the judgment of the women, than of illiterate court fops, half witted poets, and university boys. For it is plain, that women, in their manner of corrupting words, do naturally discard the consonants, as we do the vowels. What I am going to tell your lordship appears very trilling: that more than once, where some of both sexes were in company, I have persuaded two or three of each to take a pen, and write down a number of letters joined together, just as it came into their heads; and upon reading this gibberish, we have found that which the men had wrote,<a href="endnotes.xhtml#note-32" id="noteref-32" epub:type="noteref">32</a> by the frequent encountering of rough consonants, to sound like High Dutch; and the other, by the women, like Italian, abounding in vowels and liquids. Now, though I would by no means give ladies the trouble of advising us in the reformation of our language, yet I cannot help thinking, that since they have been left out of all meetings, except parties at play, or where worse designs are carried on, our conversation has very much degenerated.</p>
				<p>In order to reform our language, I conceive, my lord, that a free judicious choice should be made of such persons, as are generally allowed to be best qualified for such a work, without any regard to quality, party, or profession. These, to a certain number at least, should assemble at some appointed time and place, and fix on rules, by which they design to proceed. What methods they will take, is not for me to prescribe. Your lordship, and other persons in great employments, might please to be of the number: and I am afraid such a society would want your instruction and example, as much as your protection; for I have, not without a little envy, observed of late the style of some great ministers very much to exceed that of any other productions.</p>
				<p>The persons who are to undertake this work, will have the example of the French before them, to imitate where these have proceeded right, and to avoid their mistakes. Beside the grammar part, wherein we are allowed to be very defective, they will observe many gross improprieties, which, however authorized by practice, and grown familiar, ought to be discarded. They will find many words that deserve to be utterly thrown out of our language, many more to be corrected, and perhaps not a few long since antiquated, which ought to be restored on account of their energy and sound.</p>
				<p>But what I have most at heart, is, that some method should be thought on for ascertaining and fixing our language forever, after such alterations are made in it as shall be thought requisite. For I am of opinion, that it is better a language should not be wholly perfect, than that it should be perpetually changing; and we must give over at one time, or at length infallibly change for the worse; as the Romans did, when they began to quit their simplicity of style, for affected refinements, such as we meet in Tacitus and other authors; which ended by degrees in many barbarities,<a href="endnotes.xhtml#note-33" id="noteref-33" epub:type="noteref">33</a> even before the Goths had invaded Italy.</p>
				<p>The fame of our writers is usually confined to these two islands, and it is hard it should be limited in time, as much as place, by the perpetual variations of our speech. It is your lordship’s observation, that if it were not for the Bible and Common Prayer Book in the vulgar tongue, we should hardly be able to understand anything, that was written among us a hundred years ago; which is certainly true: for those books, being perpetually read in churches, have proved a kind of standard for language, especially to the common people. And I doubt, whether the alterations since introduced, have added much to the beauty or strength of the English tongue, though they have taken off a great deal from that simplicity, which is one of the greatest perfections in any language. You, my lord, who are so conversant in the sacred writings, and so great a judge of them in their originals, will agree, that no translation our country ever yet produced, has come up to that of the Old and New Testament: and by the many beautiful passages, which I have often had the honour to hear your lordship cite from thence, I am persuaded, that the translators of the Bible were masters of an English style much fitter for that work, than any we see in our present writings; which I take to be owing to the simplicity that runs through the whole. Then, as to the greatest part of our liturgy, compiled long before the translation of the Bible now in use, and little altered since; there seem to be in it as great strains of true sublime eloquence, as are anywhere to be found in our language; which every man of good taste will observe in the communion service, that of burial, and other parts.</p>
				<p>But when I say; that I would have our language, after it is duly corrrect, always to last, I do not mean that it should never be enlarged. Provided that no word, which a society shall give a sanction to, be afterward antiquated and exploded, they may have liberty to receive whatever new ones they shall find occasion for; because then the old books will yet be always valuable, according to their intrinsic worth, and not thrown aside on account of unintelligible words and phrases, which appear harsh and uncouth, only because they are out of fashion. Had the Roman tongue continued vulgar in that city till this time, it would have been absolutely necessary, from the mighty changes that have been made in law and religion, from the many terms of art required in trade and in war, from the new inventions that have happened in the world, from the vast, spreading of navigation and commerce, with many other obvious circumstances, to have made great additions to that language; yet the ancients would still have oeen read and understood with pleasure and ease. The Greek tongue received many enlargements between the time of Homer and that of Plutarch, yet the former author was probably as well understood in Trajan’s time, as the latter. What Horace says of words going off and perishing like leaves, and new ones coming in their place, is a misfortune he laments, rather than a thing he approves; but I cannot see why this should be absolutely necessary, or if it were, what would have become of his <i xml:lang="la">monumentum ære perennius</i>.</p>
				<p>Writing by memory only, as I do at present, I would gladly keep within my depth; and therefore shall not enter into farther particulars. Neither do I pretend more than to show the usefulness of this design, and to make some general observations, leaving the rest to that society, which I hope will owe its institution and patronage to your lordship. Besides, I would willingly avoid repetition, having about a year ago communicated to the public much of what I had to offer upon this subject, by the hands of an ingenious gentleman, who for a long time did thrice a week divert or instruct the kingdom by his papers; and is supposed to pursue the same design at present under the title of <i epub:type="se:name.publication.magazine">Spectator</i>. This author, who has tried the force and compass of our language with so much success, agrees entirely with me in most of my sentiments relating to it; so do the greatest part of the men of wit and learning, whom I have had the happiness to converse with; and therefore I imagine that such a society would be pretty unanimous in the main points.</p>
				<p>Your lordship must allow, that such a work as this, brought to perfection, would very much contribute to the glory of her majesty’s reign: which ought to be recorded in words more durable than brass, and such as our posterity may read a thousand years hence, with pleasure, as well as admiration. I always disapproved that false compliment to princes, that the most lasting monument they can have, is the hearts of their subjects. It is indeed their greatest present felicity to reign in their subjects hearts; but these are too perishable to preserve their memories, which can only be done by the pens of able and faithful historians. And I take it to be your lordship’s duty, as prime minister, to give order for inspecting our language, and rendering it fit to record the history of so great and good a princess. Besides, my lord, as disinterested as you appear to the world, I am convinced that no man is more in the power of a prevailing favourite passion than yourself; I mean that desire of true and lasting honour, which you have born along with you through every stage of your life. To this you have often sacrificed your interest, your case, and your health: for preserving and increasing this, you have exposed your person to secret treachery, and open violence. There is not perhaps an example in history of any minister, who in so short a time has performed so many great things, and overcome so many difficulties. Now, though I am fully convinced, that you fear God, honour your queen, and love your country, as much as any of your fellow subjects, yet I must believe that the desire of fame has been no inconsiderable motive to quicken you in the pursuit of those actions, which will best deserve it. But at the same time I must be so plain as to tell your lordship, that if you will not take some care to settle our language, and put it into a state of continuance, I cannot promise that your memory shall be preserved above a hundred years, farther than by imperfect tradition.</p>
				<p>As barbarous and ignorant as we were in former centuries, there was more effectual care taken by our ancestors, to preserve the memory of times and persons, than we find in this age of learning and politeness, as we are pleased to call it. The rude Latin of the monks is still very intelligible: whereas, had their records been delivered down only in the vulgar tongue, so barren and so barbarous, so subject to continual succeeding changes, they could not now be understood, unless by antiquaries, who make it their study to expound them. And we must, at this day, have been content with such poor abstracts of our English story, as laborious men of low genius would think fit to give us: and even these, in the next age, would be likewise swallowed up in succeeding collections. If things go on at this rate, all I can promise your lordship, is, that about two hundred years hence, some painful compiler, who will be at the trouble of studying old language, may inform the worlds that in the reign of queen Anne, Robert earl of Oxford, a very wise and excellent man, was made high treasurer, and saved his country, which in those days was almost ruined by a foreign war, and a domestic faction. Thus much he may be able to pick out, and willing to transfer into his new history; but the rest of your character, which I, or any other writer may now value ourselves by drawing, and the particular account of the great things done under your ministry, for which you are already so celebrated in most parts of Europe, will probably be dropped, on account of the antiquated style and manner they are delivered in.</p>
				<p>How then shall any man, who has a genius for history equal to the best of the ancients, be able to undertake such a work with spirit and cheerfulness, when he considers that he will be read with pleasure but a very few years, and in an age or two shall hardly be understood without an interpreter? This is like employing an excellent statuary to work upon mouldering stone. Those, who apply their studies to preserve the memory of others, will always have some concern for their own. And I believe it is for this reason, that so few writers among us, of any distinction, have turned their thoughts to such a discouraging employment; for, the best English historian must lie under this mortification, that when his style grows antiquated, he will be only considered as a tedious relater of facts; and perhaps consulted in his turn, among other neglected authors, to furnish materials for some future collector.</p>
				<p>I doubt your lordship is but ill entertained with a few scattered thoughts upon a subject, that deserves to be treated with ability and care: however, I must beg leave to add a few words more, perhaps not altogether foreign to the same matter. I know not whether that which I am going to say may pass for caution, advice, or reproach, any of which, will be justly thought very improper from one in my station, to one in yours. However, I must venture to affirm, that if genius and learning be not encouraged under your lordship’s administration, you are the most inexcusable person alive. All your other virtues, my lord, will be defective without this; your affability, candour, and good nature; that perpetual agreeableness of conversation, so disengaged in the midst of such a weight of business and opposition; even your justice, prudence, and magnanimity, will shine less bright without it. Your lordship is universally allowed to possess a very large portion in most parts of literature; and to this you owe the cultivating of those many virtues, which, otherwise, would have been less adorned, or in lower perfection. Neither can you acquit yourself of these obligations, without letting the arts, in their turn, share your influence and protection: besides, who knows but some true genius may happen to arise under your ministry, <i xml:lang="la">exortus ut ætherius sol</i>. Every age might perhaps produce one or two of these to adorn it, if they were not sunk under the censure and obloquy of plodding, servile, imitating pedants: I do not mean by a true genius any bold writer, who breaks through the rules of decency, to distinguish himself by the singularity of his opinions: but one, who, upon a deserving subject, is able to open new scenes, and discover a vein of true and noble thinking, which never entered into any imagination before: every stroke of whose pen is worth all the paper blotted by hundreds of others in the compass of their lives. I know, my lord, your friends will offer in your defence, that in your private capacity, you never refused your purse and credit to the service and support of learned or ingenious men: and that ever since you have been in public employment, you have constantly bestowed your favours to the most deserving persons. But I desire your lordship not to be deceived; we never will admit of these excuses, nor will allow your private liberality, as great as it is, to atone for your excessive public thrift. But here again I am afraid most good subjects will interpose in your defence, by alleging the desperate condition you found the nation in, and the necessity there was for so able and faithful a steward to retrieve it, if possible, by the utmost frugality. We grant all this, my lord; but then it ought likewise to be considered, that you have already saved several millions to the public, and that what we ask, is too inconsiderable to break into any rules of the strictest good husbandry. The French king bestows about half a dozen pensions to learned men in several parts of Europe, and perhaps a dozen in his own kingdom: which, in the whole, do probably not amount to half the income of many a private commoner in England, yet have more contributed to the glory of that prince, than any million he has otherwise employed. For, learning, like all true merit, is easily satisfied; while the false and counterfeit, is perpetually craving, and never thinks it has enough. The smallest favour given by a great prince, as a mark of esteem, to reward the endowments of the mind, never fails to be returned with praise and gratitude, and loudly celebrated to the world. I have known some years ago several pensions given to particular persons, (how deservedly I shall not inquire) any one of which, if divided into smaller parcels, and distributed by the crown to those, who might upon occasion distinguish themselves by some extraordinary production of wit or learning, would be amply sufficient to answer the end. Or, if any such persons were above money, (as every great genius certainly is with very moderate conveniencies of life) a medal, or some mark of distinction, would do full as well.</p>
				<p>But I forget my province, and find myself turning projector before I am aware; although it be one of the last characters under which I should desire to appear before your lordship, especially when I have the ambition of aspiring to that of being with the greatest respect and truth,</p>
