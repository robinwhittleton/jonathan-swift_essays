		<article id="resolutions-when-i-come-to-be-old" epub:type="chapter">
			<h2 epub:type="title">Resolutions When I Come to be Old</h2>
			<p>Not to marry a young woman.</p>
			<p>Not to keep young company, unless they desire it.</p>
			<p>Not to be peevish, or morose, or suspicious.</p>
			<p>Not to scorn present ways, or wits, or fashions, or men, or war, &amp;c.</p>
			<p>Not to be fond of children.</p>
			<p>Not to tell the same story over and over to the same people.</p>
			<p>Not to be covetous.</p>
			<p>Not to neglect decency or cleanliness, for fear of falling into nastiness.</p>
			<p>Not to be over severe with young people, but give allowances for their youthful follies and weaknesses.</p>
			<p>Not to be influenced by, or give ear to, knavish tattling servants, or others.</p>
			<p>Not to be too free of advice, nor trouble any but those who desire it.</p>
			<p>To desire some good friends to inform me which of these resolutions I break or neglect, and wherein; and reform accordingly.</p>
			<p>Not to talk much, nor of myself.</p>
			<p>Not to boast of my former beauty, or strength, or favour with ladies, &amp;c.</p>
			<p>Not to hearken to flatteries, nor conceive I can be beloved by a young woman; <i>et eos qui hæreditatem captant, odisse ac vitare</i>.</p>
			<p>Not to be positive or opinionative.</p>
			<p>Not to set up for observing all these rules, for fear I should observe none.</p>
